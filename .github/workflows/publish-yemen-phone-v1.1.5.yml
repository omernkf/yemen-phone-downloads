name: Publish Yemen Phone AI v1.1.5 to Downloads
on:
  push:
    paths:
      - '.github/workflows/publish-yemen-phone-v1.1.5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download verified production artifact
        env:
          ARTIFACT_ZIP_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-1820-8211-bef1-a41da053c2c9/raw?se=2026-11-10T17%3A38%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=188c5de8-a144-42a9-8bb7-8e3751ae519a&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-10T02%3A08%3A41Z&ske=2026-11-11T02%3A08%3A41Z&sks=b&skv=2026-02-06&sig=ZPp3MJUUgj7m9bIgfHApADV6Wp2OA0JHi2MoXFT8aTI%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_ZIP_URL" -o artifact.zip
          unzip -p artifact.zip app-release.apk > yemen-phone-ai-v1.1.5-signed.apk
          printf '%s  %s\n' '04b83a149a8010783ad48f1ae59d1bdc9322664fc8c94e534318302eb6d91835' 'yemen-phone-ai-v1.1.5-signed.apk' | sha256sum -c -
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v1.1.5 yemen-phone-ai-v1.1.5-signed.apk \
            --target main \
            --title 'Yemen Phone AI v1.1.5' \
            --notes 'Signed Android APK. General-purpose AI assistant without daily chat limits; updated welcome examples. Contact-sharing behavior unchanged.' \
            --latest
